name: CPU tests and static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,serve]"
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m vla_forge demo-planner
      - name: Basic lint
        run: ruff check --select E4,E7,E9,F .
