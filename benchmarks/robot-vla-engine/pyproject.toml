[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-vla-engine"
version = "0.1.0"
description = "Auditable robot data and policy experiment infrastructure"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "h5py>=3.10,<4", "psutil>=5.9,<8", "pyarrow>=17,<26", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "matplotlib>=3.9,<4", "huggingface-hub>=0.34,<2"]

[project.scripts]
robot-vla = "robot_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_vla = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
