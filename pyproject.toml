[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-forge"
version = "0.1.0"
description = "Intervention-guided robot policy diagnosis, verified correction, and release evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.110,<1"]

[project.optional-dependencies]
serve = ["uvicorn>=0.29,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8"]
torch = ["torch>=2.2"]

[project.scripts]
vla-forge = "vla_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
